name: Build Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    env:
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Prepare Rust
        run: |
          rustup update stable
          rustup default stable
      - run: npm ci
      - run: npm test
      - name: Build signed Windows installer
        if: env.WIN_CSC_LINK != ''
        run: npm run dist:win
        env:
          CSC_LINK: ${{ env.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ env.WIN_CSC_KEY_PASSWORD }}
      - name: Build unsigned Windows installer
        if: env.WIN_CSC_LINK == ''
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: r9club-windows-x64
          path: release/R9CLUB-AUTOMIX-Setup-*.exe
          if-no-files-found: error

  macos-arm64:
    runs-on: macos-15
    env:
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:icons
      - name: Build signed macOS package
        if: env.MAC_CSC_LINK != ''
        run: npm run dist:mac
        env:
          CSC_LINK: ${{ env.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ env.MAC_CSC_KEY_PASSWORD }}
      - name: Build unsigned macOS package
        if: env.MAC_CSC_LINK == ''
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: r9club-macos-arm64
          path: |
            release/R9CLUB-AUTOMIX-*-mac-arm64.dmg
            release/R9CLUB-AUTOMIX-*-mac-arm64.zip
          if-no-files-found: error

  macos-x64:
    runs-on: macos-15-intel
    env:
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:icons
      - name: Build signed macOS package
        if: env.MAC_CSC_LINK != ''
        run: npm run dist:mac
        env:
          CSC_LINK: ${{ env.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ env.MAC_CSC_KEY_PASSWORD }}
      - name: Build unsigned macOS package
        if: env.MAC_CSC_LINK == ''
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: r9club-macos-x64
          path: |
            release/R9CLUB-AUTOMIX-*-mac-x64.dmg
            release/R9CLUB-AUTOMIX-*-mac-x64.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-x64, macos-arm64, macos-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: r9club-*
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --title "R9CLUB AUTOMIX $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
